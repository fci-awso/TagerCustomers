<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر الفرع | متجرنا</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --ink: #1e293b;
            --ink-soft: #64748b;
            --line: #e2e8f0;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --ease: cubic-bezier(.22,.61,.36,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1rem 2rem;
            background-image:
                radial-gradient(circle at 8% 12%, rgba(59,130,246,.08) 0%, transparent 38%),
                radial-gradient(circle at 92% 88%, rgba(139,92,246,.08) 0%, transparent 38%);
        }
        .topbar {
            width: 100%; max-width: 1040px;
            display: flex; align-items: center; gap: .8rem;
            padding: 1.4rem 0;
        }
        .brand-mark {
            width: 46px; height: 46px; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; box-shadow: 0 8px 18px rgba(59,130,246,.28);
        }
        .brand-name { font-size: 1.15rem; font-weight: 900; }

        .container { max-width: 1040px; width: 100%; flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .header { text-align: center; margin: 1.5rem 0 3rem; animation: rise .6s var(--ease) both; }
        .eyebrow {
            display: inline-flex; align-items: center; gap: .5rem;
            font-size: .85rem; font-weight: 800; color: var(--primary);
            background: #eaf2ff; padding: .4rem 1rem; border-radius: 999px; margin-bottom: 1.1rem;
        }
        .header h1 { font-size: 2.7rem; font-weight: 900; line-height: 1.25; margin-bottom: .8rem; }
        .header h1 span {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .header p { font-size: 1.1rem; color: var(--ink-soft); max-width: 520px; margin: 0 auto; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .branch-card {
            display: flex; flex-direction: column;
            background: var(--surface);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--line);
            text-decoration: none; color: inherit;
            box-shadow: 0 6px 18px rgba(15,23,42,.05);
            transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
            animation: rise .6s var(--ease) both;
        }
        .branch-card:hover, .branch-card:focus-visible {
            transform: translateY(-10px);
            border-color: var(--c1);
            box-shadow: 0 28px 50px rgba(15,23,42,.12);
            outline: none;
        }
        .branch-card:focus-visible { box-shadow: 0 0 0 4px var(--soft), 0 28px 50px rgba(15,23,42,.12); }

        .card-hero {
            position: relative; overflow: hidden;
            height: 190px;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .card-hero::before, .card-hero::after {
            content: ""; position: absolute; border-radius: 50%;
            background: rgba(255,255,255,.12);
            transition: transform .6s var(--ease);
        }
        .card-hero::before { width: 220px; height: 220px; top: -90px; left: -60px; }
        .card-hero::after  { width: 160px; height: 160px; bottom: -70px; right: -40px; }
        .branch-card:hover .card-hero::before { transform: scale(1.25); }
        .branch-card:hover .card-hero::after  { transform: scale(1.35); }

        .hero-icon {
            position: relative; z-index: 1;
            width: 96px; height: 96px; border-radius: 30px;
            background: rgba(255,255,255,.2);
            border: 1px solid rgba(255,255,255,.35);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.7rem;
            transition: transform .35s var(--ease);
        }
        .branch-card:hover .hero-icon { transform: scale(1.08) rotate(-4deg); }
        .hero-num {
            position: absolute; top: 1.1rem; right: 1.3rem; z-index: 1;
            font-size: .85rem; font-weight: 800;
            background: rgba(255,255,255,.22); padding: .25rem .8rem; border-radius: 999px;
        }

        .card-body { padding: 1.8rem 1.8rem 1.9rem; display: flex; flex-direction: column; flex: 1; }
        .card-body h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 1.2rem; }

        .info { list-style: none; display: grid; gap: .9rem; margin-bottom: 1.8rem; }
        .info li { display: flex; gap: .85rem; align-items: center; font-size: .97rem; font-weight: 600; color: var(--ink-soft); }
        .info .ic {
            width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px;
            background: var(--soft); color: var(--c1);
            display: flex; align-items: center; justify-content: center; font-size: .95rem;
        }

        .btn-enter {
            margin-top: auto;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 1.4rem; border-radius: 16px;
            font-weight: 800; font-size: 1.05rem;
            background: var(--soft); color: var(--c1);
            transition: background .3s, color .3s;
        }
        .btn-enter .arrow {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--c1); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: .85rem;
            transition: transform .3s var(--ease), background .3s, color .3s;
        }
        .branch-card:hover .btn-enter { background: var(--c1); color: #fff; }
        .branch-card:hover .btn-enter .arrow { background: #fff; color: var(--c1); transform: translateX(-4px); }

        .footer { margin-top: 3rem; text-align: center; color: var(--ink-soft); font-size: .85rem; }

        @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
        @media (max-width: 520px) {
            .header h1 { font-size: 1.9rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .card-hero { height: 160px; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand-mark"><i class="fa-solid fa-store"></i></div>
        <div class="brand-name" id="storeName"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="eyebrow"><i class="fa-solid fa-location-dot"></i> فروعنا</div>
            <h1>اختر <span>الفرع</span> الأقرب إليك</h1>
            <p>حدّد الفرع لتتصفح المنتجات المتاحة وتتسوق منه مباشرة.</p>
        </header>

        <main class="cards-grid" id="branches"></main>

        <footer class="footer">© <span id="currentYear"></span> <span id="footName"></span> - جميع الحقوق محفوظة</footer>
    </div>

    <script>
    /* ==========================================================
       ✏️ عدّل هذه البيانات فقط (هاي تكنولوجي، الفروع، الروابط)
       ========================================================== */
    const STORE = { name: "هاي تكنولوجي" };

    const BRANCHES = [
        {
            name: "الفرع الأول",
            icon: "fa-store",
            c1: "#0284c7", c2: "#38bdf8", soft: "#e0f2fe",
            address: "المنيا - سكة تللة اعلى كشري العمدة",
            phone: "01008468348",
            link: "http://hta1.runasp.net/Store"      // ← رابط الفرع الأول
        },
        {
            name: "الفرع الثاني",
            icon: "fa-shop",
            c1: "#7c3aed", c2: "#a78bfa", soft: "#ede9fe",
            address: "المنيا - الحسيني قبلي سينما بالاس محل قرطبة الدور الثاني",
            phone: "01025811874",
            link: "http://hta2.runasp.net/Store"      // ← رابط الفرع الثاني
        }
    ];

    /* ---------- التشغيل ---------- */
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    document.getElementById('storeName').textContent = STORE.name;
    document.getElementById('footName').textContent = STORE.name;
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    document.title = 'اختر الفرع | ' + STORE.name;

    document.getElementById('branches').innerHTML = BRANCHES.map((b, i) => `
        <a class="branch-card" href="${esc(b.link)}" target="_blank" rel="noopener noreferrer"
           style="--c1:${b.c1};--c2:${b.c2};--soft:${b.soft};animation-delay:${.1 + i * .12}s">
            <div class="card-hero">
                <span class="hero-num">فرع ${i + 1}</span>
                <div class="hero-icon"><i class="fa-solid ${esc(b.icon)}"></i></div>
            </div>
            <div class="card-body">
                <h2>${esc(b.name)}</h2>
                <ul class="info">
                    <li><span class="ic"><i class="fa-solid fa-location-dot"></i></span><span>${esc(b.address)}</span></li>
                    <li><span class="ic"><i class="fa-solid fa-phone"></i></span><span dir="ltr">${esc(b.phone)}</span></li>
                </ul>
                <span class="btn-enter">تسوّق من هذا الفرع <span class="arrow"><i class="fa-solid fa-arrow-left"></i></span></span>
            </div>
        </a>`).join('');
    </script>
</body>
</html>
